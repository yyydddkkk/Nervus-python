[project]
name = "nervus-python"
version = "0.1.0a1"
description = "A persistent Python agent kernel with Turn-scoped capability snapshots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = []

[project.urls]
Repository = "https://github.com/yyydddkkk/Nervus-python"
Issues = "https://github.com/yyydddkkk/Nervus-python/issues"

[project.scripts]
nervus = "nervus.host.terminal:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nervus"
source-include = ["examples/*.py", "tests/**", "scripts/export_public.py", "scripts/verify_public.py", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "uv.lock", ".python-version", ".env.example"]
source-exclude = ["docs/**", "experiments/**", "prototype/**", "CONTEXT.md"]
